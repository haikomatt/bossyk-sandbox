name: CI

# Deterministic checks only: ruff, mypy (strict), and the pytest suite
# including the env-gated stub E2E tests. Nothing here needs an API key,
# network model call, or GPU — the billable benchmark scripts
# (h1_bench real mode, benchmark_run) are explicitly out of scope.
#
# Layout: this repo resolves auditk as an editable path dependency from a
# sibling checkout (../auditk), tau2 is a pinned git source whose data tree
# comes from a ../tau2-bench checkout at the same rev (TAU2_DATA_DIR, set by
# tests/conftest.py), and the trace tests validate against ../auditk-spec
# schemas — so the job recreates the documented sibling layout. All public;
# bossyk (the optional fourth sibling) is private and NOT required for the
# deterministic suite (its judge import is env-gated), so it is not checked out.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bossyk-sandbox
        uses: actions/checkout@v4
        with:
          path: bossyk-sandbox

      - name: Check out auditk (sibling)
        uses: actions/checkout@v4
        with:
          repository: auditk/auditk
          path: auditk

      - name: Check out tau2-bench data (sibling, same rev as pyproject pins)
        uses: actions/checkout@v4
        with:
          repository: sierra-research/tau2-bench
          ref: 5ebebbe827b455b3ed04fcb9294235c6ef4e5fd6
          path: tau2-bench

      - name: Check out auditk-spec (sibling)
        uses: actions/checkout@v4
        with:
          repository: auditk/auditk-spec
          path: auditk-spec

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: bossyk-sandbox
        run: uv sync --dev --extra experiments

      - name: Ruff format
        working-directory: bossyk-sandbox
        run: uv run ruff format --check .

      - name: Ruff lint
        working-directory: bossyk-sandbox
        run: uv run ruff check .

      - name: Mypy (strict)
        working-directory: bossyk-sandbox
        run: uv run mypy --explicit-package-bases src/ tests/

      - name: Pytest (deterministic, incl. stub E2E)
        working-directory: bossyk-sandbox
        env:
          RUN_SANDBOX_E2E: "1"
        run: uv run pytest tests/ --no-cov -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
