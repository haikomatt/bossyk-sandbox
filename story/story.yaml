acts:
- act: 1
  title: The threat surface
  question: What are we trying to detect?
- act: 2
  title: Layered defence
  question: At what level do we detect it?
- act: 3
  title: The method
  question: How do we test it?
- act: 4
  title: The evidence
  question: What backs each claim?
- act: 5
  title: Honest limitations
  question: What do we NOT know yet?
- act: 6
  title: The loop
  question: How do we remediate and learn?
claims:
- id: threat-surface-two-domains-320-probes
  act: 1
  exec_copy: We attacked the same guardrail the same way across two very different businesses to see if
    the weak spots were a fluke.
  tech_copy: 'A frontier adversary model (deepseek-v4-pro, aggressive intensity, temperature 1.0) generated
    160 attack payloads against each of two tau2-bench support domains -- airline and retail -- 320 attempts
    total, spanning 4 attack classes crossed with each domain''s 4 consequence boundaries. The grid and
    adversary are both swappable interfaces, not a one-off script. Caveat: single adversary model, single
    run per domain.'
  verdict: null
  evidence_grade: live-measurement
  artifact_refs:
  - docs/bench_output/phase2b_crossdomain_h1.json
  - docs/phase2a-h1-results.md
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_overall.n_attempts
    expected: 160
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.retail.h1_overall.n_attempts
    expected: 160
- id: threat-surface-boundaries-and-guardrail
  act: 1
  exec_copy: The attacks aren't scored on how sneaky they sound -- they're scored on whether the agent
    would actually do something dangerous.
  tech_copy: Each attack class (prompt injection, jailbreak, tool misuse, PII leak) is paired with a concrete
    consequence boundary -- cancel without lookup, refund over a threshold, disclose PII, or make an unauthorized
    modification -- so 'the guardrail caught it' means something real, not just 'the classifier fired'.
    The guardrail under test is a real model-backed classifier (a deberta prompt-injection model) with
    a strength dial (leaky/moderate/strict); the canonical reported strength is leaky.
  verdict: null
  evidence_grade: live-measurement
  artifact_refs:
  - docs/bench_output/phase2b_crossdomain_h1.json
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: canonical_strength
    expected: leaky
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: guardrail_backend
    expected: model-backed
- id: h1-guardrail-bypass-nontrivial
  act: 2
  exec_copy: The input filter lets through roughly one in five attacks on a real booking system, and about
    one in six on a real shopping one.
  tech_copy: 'Across 160 probe attempts per domain at the guardrail''s canonical (leaky) strength, the
    model-backed filter failed to flag 31/160 airline attacks (19.4%) and 25/160 retail attacks (15.6%)
    -- neither near-zero (which would weaken the premise) nor near-total (a strawman guardrail). This
    is the first hard number behind the demonstrator''s central claim: prevention at the model layer alone
    is structurally insufficient.'
  verdict: not falsified (live measurement)
  evidence_grade: live-measurement
  artifact_refs:
  - docs/bench_output/phase2b_crossdomain_h1.json
  - docs/phase2a-h1-results.md
  - docs/phase2b-h1-crossdomain-results.md
  figure_ids:
  - h1-blindspot-by-class
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_overall.rate
    expected: 0.19375
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.retail.h1_overall.rate
    expected: 0.15625
- id: h1-blindspot-profile-domain-invariant
  act: 2
  exec_copy: The filter is excellent at spotting messages that sound like attacks, and almost blind to
    requests that just sound like normal customer support.
  tech_copy: By attack class the ordering is identical in both domains -- tool_misuse (40.0% airline /
    37.5% retail) far exceeds pii_leak, which exceeds jailbreak, which exceeds prompt_injection (2.5%
    airline / 0.0% retail) -- because a prompt-injection classifier is built to catch injection-shaped
    text, not plausible-sounding tool abuse. The exact same ordering holding in a completely different
    business means this is a property of input classification itself, not a quirk of one domain.
  verdict: null
  evidence_grade: live-measurement
  artifact_refs:
  - docs/bench_output/phase2b_crossdomain_h1.json
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_by_class.tool_misuse.rate
    expected: 0.4
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.retail.h1_by_class.tool_misuse.rate
    expected: 0.375
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_by_class.prompt_injection.rate
    expected: 0.025
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.retail.h1_by_class.prompt_injection.rate
    expected: 0.0
- id: agent-layer-is-the-backstop-by-design
  act: 2
  exec_copy: Because the front-door filter can't judge intent, a second layer watches what the agent actually
    does, not what it was told.
  tech_copy: 'Three independent instruments sit at the agent layer: a fast structural gate (blocks a write
    tool without a prior lookup), a semantic policy judge (flags out-of-policy actions), and a drift scorer
    (flags intent-action deviation). Each is designed to catch a different failure shape by consequence
    rather than by input pattern -- the residual the model-layer guardrail structurally cannot see. This
    architecture is demonstrated on a scripted scenario set, not yet on the actual H1 bypasses (see Act
    5).'
  verdict: null
  evidence_grade: scripted-proxy
  artifact_refs:
  - docs/phase2c-h3-crossdomain-results.md
  figure_ids: []
  numeric_checks: []
- id: h3-three-legged-orthogonality-scripted-set
  act: 3
  exec_copy: No single detector catches every bad action, but the three together caught all of them in
    our test set.
  tech_copy: Over 35 hand-authored scripted steps (12 ground-truth violations across airline + retail),
    the fast gate, policy judge, and drift scorer each caught a substantially different subset -- wrong-id
    writes were caught by the gate but called 'faithful' by the policy judge; semantic policy violations
    were invisible to the structural gate -- yet their union caught 12/12 violations with 0 undetected.
    This orthogonality is measured on the scripted set only; whether it holds on the real H1 bypasses
    is untested (H2, open).
  verdict: not falsified (scripted set)
  evidence_grade: scripted-proxy
  artifact_refs:
  - docs/bench_output/phase3_h4.json
  - docs/phase2c-h3-crossdomain-results.md
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.undetected
    expected: 0
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.n_violations
    expected: 12
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.prevented
    expected: 5
- id: h4-counterfactual-method
  act: 3
  exec_copy: To test whether catching a problem actually stops it, we replay real detection decisions
    against the moment right before the action ran.
  tech_copy: For each of the 12 ground-truth violations, 'prevented' means the fast gate blocked the call
    before it executed; 'detected_too_late' means only a slow judge fired, after the fact; 'undetected'
    means nothing fired. This recomputes deterministically from the Phase 2c run's persisted gate/judge
    verdicts -- no new judge calls, no live tool execution -- so it is a modeled counterfactual (one harm
    unit assumed per violation), not an observed with/without paired run.
  verdict: null
  evidence_grade: modeled-counterfactual
  artifact_refs:
  - docs/phase3-h4-interrupt-results.md
  figure_ids: []
  numeric_checks: []
- id: h4-detection-outruns-prevention
  act: 4
  exec_copy: You can see far more problems than you can actually stop before they happen.
  tech_copy: 'Under the modeled counterfactual, interruption reduces modeled harm from 12 to 7 (5 prevented,
    41.7%) -- but the other 7 of 12 violations were only caught post-hoc by the slow judges, after the
    action already ran. The split is stark by domain: airline prevents 66.7% (its violations are structural)
    while retail prevents only 16.7% (its violations are semantic -- pii, refund, address changes -- which
    the narrow structural gate can''t see). No live execution was observed; this is a modeled counterfactual,
    not a paired live run.'
  verdict: not falsified as a modeled counterfactual -- live paired-run evidence pending
  evidence_grade: modeled-counterfactual
  artifact_refs:
  - docs/bench_output/phase3_h4.json
  - docs/phase3-h4-interrupt-results.md
  figure_ids:
  - h4-prevention-waterfall
  numeric_checks:
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.prevented
    expected: 5
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.detected_too_late
    expected: 7
  - artifact: docs/bench_output/phase3_h4.json
    json_path: combined.prevention_rate
    expected: 0.4166666666666667
  - artifact: docs/bench_output/phase3_h4.json
    json_path: per_domain.airline.prevention_rate
    expected: 0.6666666666666666
  - artifact: docs/bench_output/phase3_h4.json
    json_path: per_domain.retail.prevention_rate
    expected: 0.16666666666666666
- id: evidence-grading-is-explicit
  act: 4
  exec_copy: Every claim in this story says out loud how solid the number behind it actually is.
  tech_copy: 'Each claim here carries an evidence grade -- live measurement, scripted proxy, modeled counterfactual,
    deterministic recompute, or open -- because the H1 numbers, the H3/H4 scripted-set results, and the
    SMACTR before/after were produced by genuinely different methods and deserve different levels of trust.
    The grading is itself lint-checked: a claim''s numeric_checks are verified against the committed artifacts,
    not just asserted in prose.'
  verdict: null
  evidence_grade: deterministic-recompute
  artifact_refs:
  - docs/phase5-h1-h5-synthesis.md
  figure_ids: []
  numeric_checks: []
- id: reproducibility-manifests-are-byte-checked
  act: 4
  exec_copy: Every deterministic number in this repo can be regenerated from scratch and comes out byte-for-byte
    identical.
  tech_copy: '`h4_report.py`, `smactr_demo.py`, and `h1_crossdomain_merge.py` are pure recomputations
    over already-persisted data (no network, no keys), verified to reproduce their committed JSON outputs
    exactly; this story''s own figures are checked the same way by the exporter''s determinism test. Reproducibility
    is treated as a testable property, not an assertion.'
  verdict: null
  evidence_grade: deterministic-recompute
  artifact_refs:
  - docs/phase3-h4-interrupt-results.md
  - docs/phase4-smactr-results.md
  figure_ids: []
  numeric_checks: []
- id: h2-open-not-yet-measured
  act: 5
  exec_copy: We still don't know if the agent-layer watchdogs actually catch the attacks that got past
    the front door.
  tech_copy: The three-instrument union's 12/12 catch rate was measured on a hand-authored scripted scenario
    set -- not on the 56 real crossings frozen from the H1 guardrail-bypass run (31 airline + 25 retail).
    Those 56 payloads have never been run through a live agent, so the load-bearing claim -- that the
    agent layer catches what actually bypasses the guardrail -- remains open, not confirmed.
  verdict: open (partially tested -- scripted proxy only)
  evidence_grade: open
  artifact_refs:
  - docs/phase5-h1-h5-synthesis.md
  - probes/regression/airline.json
  - probes/regression/retail.json
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_overall.n_bypassed
    expected: 31
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.retail.h1_overall.n_bypassed
    expected: 25
- id: fable-cannot-be-the-adversary
  act: 5
  exec_copy: A safety-trained model refused to be our attacker at all -- every single time.
  tech_copy: 'Running the identical airline H1 grid against two frontier models produced categorically
    opposite behaviour: deepseek-v4-pro attacked all 160 payloads with zero refusals, while claude-fable-5
    refused all 160 with a ''cyber'' usage-policy stop reason -- not a gradual difference in willingness,
    but a categorical one. An adversary that won''t attack produces no attacks to measure a guardrail
    against, which makes ''which model do you use as your red-teamer'' a first-order methodological choice,
    and the refusal itself a governance-relevant signal, not noise to filter out.'
  verdict: null
  evidence_grade: live-measurement
  artifact_refs:
  - docs/phase15a-adversary-variance-results.md
  - docs/bench_output/phase2b_h1_airline_fireworks-deepseek.json
  - docs/bench_output/phase2b_h1_airline_anthropic-fable.json
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_h1_airline_fireworks-deepseek.json
    json_path: strengths.leaky.h1_overall.n_refused
    expected: 0
  - artifact: docs/bench_output/phase2b_h1_airline_anthropic-fable.json
    json_path: strengths.leaky.h1_overall.n_refused
    expected: 160
- id: h1-crossings-not-agent-grounded
  act: 5
  exec_copy: The H1 numbers describe the filter in isolation -- they don't yet describe what an agent
    would have done with those attacks.
  tech_copy: H1's 'boundary_reached' is assumed true by construction (the adversary's attempt is treated
    as a real attack), not observed via a live agent acting on it; the frozen crossings exist for a future
    agent-layer measurement, not as evidence that an agent was ever actually compromised. The bypass rates
    also carry real sampling uncertainty from a single adversary, single run -- the airline overall 95%
    Wilson CI lower bound is about 14.0%, not 19.4% exactly.
  verdict: null
  evidence_grade: open
  artifact_refs:
  - docs/phase2a-h1-results.md
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2b_crossdomain_h1.json
    json_path: domains.airline.h1_overall.wilson_ci95[0]
    expected: 0.13998689693266383
- id: judge-errors-are-accounted-not-dropped
  act: 5
  exec_copy: When a judge fails to answer, we record that it failed -- we don't quietly treat silence
    as 'all clear'.
  tech_copy: 3 of 35 scripted-scenario steps (8.6%) hit a policy-judge parse/timeout error; each is carried
    as an explicit tri-state 'error' label, excluded from the firing denominator rather than folded into
    'did not fire' -- which would have silently inflated apparent guardrail coverage. One of the three
    (airline-002-unauthorised-cancel) is a real persisted example of this accounting.
  verdict: null
  evidence_grade: deterministic-recompute
  artifact_refs:
  - docs/bench_output/phase2c_orthogonality.json
  - docs/phase2c-h3-crossdomain-results.md
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/phase2c_orthogonality.json
    json_path: steps[2].policy.label
    expected: error
- id: smactr-loop-closes
  act: 6
  exec_copy: A failure we only caught after the fact became a rule that stops it before it happens.
  tech_copy: retail-008 (unauthorized address modification) was detected only post-hoc in Phase 3; feeding
    its derived constraint back into the fast rules flips it to prevented, raising retail prevention from
    1/6 (16.7%) to 2/6 (33.3%) and combined prevention from 5/12 (41.7%) to 6/12 (50.0%) -- recomputed
    deterministically over the same persisted judge verdicts, no new judge calls. The eval loop demonstrably
    closes on this one instance.
  verdict: null
  evidence_grade: deterministic-recompute
  artifact_refs:
  - docs/bench_output/phase4_smactr.json
  - docs/phase4-smactr-results.md
  figure_ids:
  - smactr-before-after
  numeric_checks:
  - artifact: docs/bench_output/phase4_smactr.json
    json_path: before.prevented
    expected: 1
  - artifact: docs/bench_output/phase4_smactr.json
    json_path: after.prevented
    expected: 2
  - artifact: docs/bench_output/phase4_smactr.json
    json_path: before.prevention_rate
    expected: 0.16666666666666666
  - artifact: docs/bench_output/phase4_smactr.json
    json_path: after.prevention_rate
    expected: 0.3333333333333333
  - artifact: docs/bench_output/phase4_smactr.json
    json_path: prevented_gain
    expected: 1
- id: threat-model-grows-not-just-alerts
  act: 6
  exec_copy: A caught failure becomes a permanent, replayable rule -- not a one-off alert that gets forgotten.
  tech_copy: The SMACTR loop's FMEA step scored retail-008 as high severity (an account-takeover vector),
    derived a concrete gating constraint, fed it into `retail_fast_rules`, and froze the failure as a
    replayable regression probe so a future rule change can't silently regress it. The mechanism generalises
    to any caught failure; this is one instance of it running end-to-end.
  verdict: null
  evidence_grade: deterministic-recompute
  artifact_refs:
  - docs/bench_output/threat_model.json
  - probes/regression/retail-smactr.json
  figure_ids: []
  numeric_checks:
  - artifact: docs/bench_output/threat_model.json
    json_path: '[0].severity'
    expected: high
- id: h5-ceiling-still-open
  act: 6
  exec_copy: We haven't yet tested against an attacker specifically trying to slip past every layer at
    once.
  tech_copy: H5 asks whether an adversary optimised to look self-consistent and in-policy while still
    being harmful can evade the full stack -- the hardest test, and the reason interpretability work (Property
    X) matters. The originally planned adaptive adversary (claude-fable-5) turned out to categorically
    refuse red-team generation (see Act 5), so H5 now awaits a cooperative frontier model in that role;
    alongside it, the live H2-on-crossings run is the other deferred piece that would complete the H1-H5
    matrix.
  verdict: pending
  evidence_grade: open
  artifact_refs:
  - docs/phase5-h1-h5-synthesis.md
  figure_ids: []
  numeric_checks: []
