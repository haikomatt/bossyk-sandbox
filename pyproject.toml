[project]
name = "bossyk-sandbox"
version = "0.1.0"
description = "bossyk sandbox — live cross-domain agent governance demonstrator"
requires-python = ">=3.12"
dependencies = [
    "auditk",
    "tau2",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jsonschema>=4.23",
    "cryptography>=43",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "anthropic>=0.117.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Phase 1's real drift judge (auditk's llm-judge@0.3 scorer) needs auditk's
# `nli` extra (torch + transformers, local NLI model). Only needed for
# scripts/benchmark_run.py, not for the deterministic test suite — install
# with `uv sync --extra bench`.
bench = ["auditk[nli]"]

[tool.uv.sources]
auditk = { path = "../auditk", editable = true }
tau2 = { path = "../tau2-bench", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20260518",
    "matplotlib>=3.11.1",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bossyk_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["auditk.*", "tau2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers/torch belong to the optional `bench` extra (model-backed
# guardrail + auditk NLI); their imports are env-gated at runtime. CI and
# fresh checkouts type-check without the ~GBs of the bench extra installed.
# nnsight/transformer_lens are the interp pod-only capture deps -- installed on
# the RunPod pod, never locally; scripts/interp_capture.py imports nnsight lazily.
module = ["transformers.*", "torch.*", "nnsight.*", "transformer_lens.*"]
ignore_missing_imports = true
