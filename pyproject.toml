[project]
name = "bossyk-sandbox"
version = "0.2.0"
description = "bossyk sandbox — live cross-domain agent governance demonstrator"
license = { text = "BUSL-1.1" }
requires-python = ">=3.12"
dependencies = [
    "auditk",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jsonschema>=4.23",
    "cryptography>=43",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "anthropic>=0.117.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The experiment half of the repo (LangGraph agent runtime, live multi-turn
# conditions, the console demo, and their tests) runs inside Sierra's
# tau2-bench airline/retail environments. The gate proxy needs none of it,
# so a gate-only install is `uv sync`; the experiments (and CI) use
# `uv sync --extra experiments`, which also needs the ../tau2-bench sibling.
experiments = ["tau2"]
# Phase 1's real drift judge (auditk's llm-judge@0.3 scorer) needs auditk's
# `nli` extra (torch + transformers, local NLI model). Only needed for
# scripts/benchmark_run.py, not for the deterministic test suite — install
# with `uv sync --extra bench`.
bench = ["auditk[nli]"]
# Pod-only, phase-detector-training.md build-order step 4: HF Trainer full
# fine-tune (DeBERTa-v3-small) + PEFT/LoRA (Qwen2.5-0.5B-Instruct). Installed
# on the RunPod pod via `uv sync --extra detector-train`, never locally --
# mirrors the `bench` extra's convention (see `HFTrainBackend`'s lazy imports
# in `bossyk_sandbox.detector.train_backend`).
detector-train = [
    "torch>=2.5",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[tool.uv.sources]
auditk = { path = "../auditk", editable = true }
# Pinned upstream commit (2026-06-10); not a sibling checkout, so a gate-only
# `uv sync` never needs it on disk. Bump the rev deliberately.
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "5ebebbe827b455b3ed04fcb9294235c6ef4e5fd6" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
    "types-jsonschema>=4.26.0.20260518",
    "matplotlib>=3.11.1",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bossyk_sandbox"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["auditk.*", "tau2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers/torch belong to the optional `bench` extra (model-backed
# guardrail + auditk NLI); their imports are env-gated at runtime. CI and
# fresh checkouts type-check without the ~GBs of the bench extra installed.
# nnsight/transformer_lens are the interp pod-only capture deps -- installed on
# the RunPod pod, never locally; scripts/interp_capture.py imports nnsight lazily.
# peft/accelerate belong to the pod-only `detector-train` extra --
# `HFTrainBackend` (bossyk_sandbox.detector.train_backend) imports them lazily.
module = ["transformers.*", "torch.*", "nnsight.*", "transformer_lens.*", "peft.*", "accelerate.*"]
ignore_missing_imports = true
